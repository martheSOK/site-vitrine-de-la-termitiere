services:

  # ============================================================
  # SITE VITRINE
  # ============================================================

  vitrine:
    image: ${VITRINE_IMAGE}

    container_name: termitiere-vitrine

    restart: unless-stopped

    networks:
      - deploy_default


  # ============================================================
  # CONTACT PROXY
  # ============================================================

  contact-proxy:
    image: ${CONTACT_PROXY_IMAGE}

    container_name: termitiere-contact-proxy

    restart: unless-stopped

    environment:
      PORT: "8081"
      BREVO_API_KEY: "${BREVO_API_KEY}"
      BREVO_SENDER_EMAIL: "${BREVO_SENDER_EMAIL}"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN}"

    networks:
      - deploy_default


  # ============================================================
  # OAUTH PROXY
  # ============================================================

  oauth-proxy:
    image: ${OAUTH_PROXY_IMAGE}

    container_name: termitiere-oauth-proxy

    restart: unless-stopped

    environment:
      PORT: "8080"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET}"
      OAUTH_SCOPE: "${OAUTH_SCOPE:-repo,user}"

    networks:
      - deploy_default


# ==============================================================
# RESEAU PARTAGE AVEC TERMITIERE-PLATFORM
# ==============================================================

networks:
  deploy_default:
    external: true
    name: deploy_default
